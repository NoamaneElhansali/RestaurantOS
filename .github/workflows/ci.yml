name: RestaurantOS Foundation CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Lockfiles cannot be generated in the current offline environment.
      # Workaround for npm Arborist's known optional-peer edgesOut crash.
      # Remove after a compatible lockfile and clean npm ci are verified.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: restaurantos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurantos -d restaurantos_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: restaurantos_test
      DB_USERNAME: restaurantos
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, dom, xml, curl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
      - run: php artisan migrate --force
      - run: php artisan test

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:offline

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify full Compose stack and database outage recovery
        run: bash tools/tests/phase1-compose-smoke.sh

  composer-lock-export:
    runs-on: ubuntu-latest
    # Temporary, read-only transfer of dependency metadata for lockfile commit.
    # Remove after the lockfile is committed.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, dom, xml, curl
          coverage: none
          tools: composer:v2
      - name: Resolve public package metadata
        run: composer update --no-install --no-interaction --prefer-dist --no-progress
      - name: Export composer.lock in bounded log lines for review and commit
        run: |
          test -s composer.lock
          printf 'LOCK_TRANSFER_BEGIN\\n'
          base64 -w0 composer.lock | fold -w 120 | sed 's/^/LOCKCHUNK:/'
          printf '\\nLOCK_TRANSFER_END\\n'

  web-lock-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve web dependency lock
        run: npm install --legacy-peer-deps --no-audit --no-fund --package-lock-only
      - name: Export package-lock without secrets
        run: |
          test -s package-lock.json
          echo 'WEB_LOCK_BEGIN'
          base64 -w0 package-lock.json | fold -w 120 | sed 's/^/WEBLOCKCHUNK:/'
          echo 'WEB_LOCK_END'

  phase2-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Real browser-session, CSRF and identity smoke
        run: bash tools/tests/phase2-compose-smoke.sh
